
      - name: Fix SSH URLs and Sync Source
        shell: bash
        run: |
          set -euxo pipefail
          cd "$SOURCE_DIR"

          echo "=== Fix GitHub SSH remotes in manifests ==="

          # Ubah URL GitHub SSH menjadi HTTPS
          find .repo/manifests .repo/local_manifests \
            -type f -name '*.xml' 2>/dev/null \
            -exec sed -i \
              -e 's#ssh://git@github\.com/omnirom#https://github.com/omnirom#g' \
              -e 's#ssh://git@github\.com/#https://github.com/#g' \
              -e 's#git@github\.com:#https://github.com/#g' \
              {} + || true

          # Pastikan repo tidak memakai SSH ControlMaster
          export GIT_SSH=ssh

          echo "=== Remaining GitHub SSH URLs ==="
          grep -R -n -E \
            'ssh://git@github\.com|git@github\.com:' \
            .repo/manifests .repo/local_manifests \
            2>/dev/null || true

          echo "=== Sync source ==="
          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j2
            
          
