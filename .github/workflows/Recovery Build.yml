
name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: OrangeFox sync repository
        required: true
        default: https://gitlab.com/OrangeFox/sync.git

      MANIFEST_BRANCH:
        description: OrangeFox manifest branch
        required: true
        default: "14.1"

      DEVICE_TREE_URL:
        description: X6855 device tree repository
        required: true
        default: https://github.com/M0z41D/Device_Tree_X6855.git

      DEVICE_TREE_BRANCH:
        description: Device tree branch
        required: true
        default: main

      DEVICE_PATH:
        description: Device tree path
        required: true
        default: device/infinix/X6855

      PRODUCT_NAME:
        description: Product name
        type: choice
        options:
          - fox_X6855
          - twrp_X6855
        required: true
        default: fox_X6855

      BUILD_VARIANT:
        description: Build variant
        type: choice
        options:
          - eng
          - userdebug
        required: true
        default: eng

      TARGET_RELEASE:
        description: Release suffix required by this manifest
        required: true
        default: trunk_staging

      BUILD_TARGET:
        description: Build target
        required: true
        default: vendorbootimage

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Initialize workspace
        id: pwd
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          echo "workspace-folder=$GITHUB_WORKSPACE/workspace" >> "$GITHUB_OUTPUT"

      - name: Prepare build environment
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        shell: bash
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y git python3 tar aria2

          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts

          sudo bash setup/android_build_env.sh

          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "11"

      - name: Sync OrangeFox sources
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        env:
          SYNC_URL: ${{ inputs.SYNC_URL }}
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        shell: bash
        run: |
          set -eo pipefail
          git clone "$SYNC_URL" sync
          cd sync

          ./orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$GITHUB_WORKSPACE/workspace/fox_$MANIFEST_BRANCH"

      - name: Clone device tree
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
          TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
          TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
          DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
        shell: bash
        run: |
          set -eo pipefail
          cd "fox_$MANIFEST_BRANCH"

          mkdir -p "$(dirname "$DEVICE_PATH")"
          git clone --depth=1 \
            --branch "$TREE_BRANCH" \
            --single-branch \
            "$TREE_URL" "$DEVICE_PATH"

      - name: Verify and inspect device configuration
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
          DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
          PRODUCT_NAME: ${{ inputs.PRODUCT_NAME }}
        shell: bash
        run: |
          set -eo pipefail
          cd "fox_$MANIFEST_BRANCH"

          for file in AndroidProducts.mk BoardConfig.mk device.mk; do
            if [ ! -f "$DEVICE_PATH/$file" ]; then
              echo "::error::Missing $DEVICE_PATH/$file"
              exit 1
            fi
          done

          PRODUCT_FILE="$DEVICE_PATH/$PRODUCT_NAME.mk"
          if [ ! -f "$PRODUCT_FILE" ]; then
            echo "::error::Missing product file: $PRODUCT_FILE"
            exit 1
          fi

          echo "=== AndroidProducts.mk ==="
          cat "$DEVICE_PATH/AndroidProducts.mk"

          echo "=== vendorsetup.sh ==="
          if [ -f "$DEVICE_PATH/vendorsetup.sh" ]; then
            cat "$DEVICE_PATH/vendorsetup.sh"
          fi

          echo "=== Selected product ==="
          cat "$PRODUCT_FILE"

          echo "=== Required OrangeFox config ==="
          if [ "$PRODUCT_NAME" = "fox_X6855" ]; then
            if [ ! -f vendor/fox/config/common.mk ]; then
              echo "::error::OrangeFox common config is missing"
              exit 1
            fi
          fi

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build vendor boot image
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
          DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
          PRODUCT_NAME: ${{ inputs.PRODUCT_NAME }}
          BUILD_VARIANT: ${{ inputs.BUILD_VARIANT }}
          TARGET_RELEASE: ${{ inputs.TARGET_RELEASE }}
          BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
        shell: bash
        run: |
          set -eo pipefail
          cd "fox_$MANIFEST_BRANCH"

          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true

          echo "=== Available release configs ==="
          list_release_configs || true

          echo "=== Available products ==="
          list_products || true

          echo "=== Lunch selection ==="
          echo "Product: $PRODUCT_NAME"
          echo "Release: $TARGET_RELEASE"
          echo "Variant: $BUILD_VARIANT"

          lunch "$PRODUCT_NAME-$TARGET_RELEASE-$BUILD_VARIANT"

          echo "=== Selected build configuration ==="
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_RELEASE=$TARGET_RELEASE"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"

          mka adbd "$BUILD_TARGET" -j"$(nproc --all)"

      - name: Verify build output
        if: success()
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
          PRODUCT_NAME: ${{ inputs.PRODUCT_NAME }}
        shell: bash
        run: |
          set -eo pipefail
          cd "fox_$MANIFEST_BRANCH"

          OUT="out/target/product/$PRODUCT_NAME"

          echo "=== Available image outputs ==="
          find out/target/product -type f \
            \( -name '*.img' -o -name '*.zip' \) -print

          if [ ! -f "$OUT/vendor_boot.img" ]; then
            echo "::error::vendor_boot.img not found in $OUT"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$OUT/vendor_boot.img" \
            "$GITHUB_WORKSPACE/release/vendor_boot.img"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X6855-Recovery-vendor-boot
          path: release/vendor_boot.img
          if-no-files-found: error
          retention-days: 7
          
