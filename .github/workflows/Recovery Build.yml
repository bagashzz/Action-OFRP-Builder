
name: Recovery Build - OrangeFox X6855

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: OrangeFox manifest branch
        required: true
        default: "14.1"

      DEVICE_TREE_URL:
        description: Your OrangeFox device tree
        required: true
        default: "https://github.com/bagashzz/fox_device_infinix_X6855.git"

      DEVICE_TREE_BRANCH:
        description: OrangeFox device tree branch
        required: true
        default: "fox_14.1"

      BUILD_VARIANT:
        description: Build variant
        type: choice
        options:
          - eng
          - userdebug
        required: true
        default: eng

      BUILD_TARGET:
        description: Build target
        required: true
        default: "vendorbootimage"

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Cleanup runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Initialize workspace
        id: workspace
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          echo "path=$GITHUB_WORKSPACE/workspace" >> "$GITHUB_OUTPUT"

      - name: Prepare build environment
        working-directory: ${{ steps.workspace.outputs.path }}
        shell: bash
        run: |
          set -eo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git python3 tar aria2 curl rsync unzip

          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts

          sudo bash setup/android_build_env.sh

          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Sync OrangeFox 14.1
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        shell: bash
        run: |
          set -eo pipefail

          git clone https://gitlab.com/OrangeFox/sync.git sync
          cd sync

          ./orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$GITHUB_WORKSPACE/workspace/fox_$MANIFEST_BRANCH"

      - name: Clone OrangeFox device tree
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
          TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
          TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
        shell: bash
        run: |
          set -eo pipefail

          cd "fox_$MANIFEST_BRANCH"

          mkdir -p device/infinix

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$TREE_BRANCH" \
            "$TREE_URL" \
            device/infinix/X6855

      - name: Verify device tree and dependencies
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        shell: bash
        run: |
          set -eo pipefail
          cd "fox_$MANIFEST_BRANCH"

          DEVICE="device/infinix/X6855"

          for file in \
            AndroidProducts.mk \
            BoardConfig.mk \
            device.mk \
            fox_X6855.mk \
            fox.mk \
            twrp.mk \
            vendorsetup.sh
          do
            if [ ! -f "$DEVICE/$file" ]; then
              echo "::error::Missing device file: $DEVICE/$file"
              exit 1
            fi
          done

          echo "=== Device tree branch ==="
          git -C "$DEVICE" branch --show-current
          git -C "$DEVICE" log -1 --oneline

          echo "=== Product configuration ==="
          cat "$DEVICE/AndroidProducts.mk"
          cat "$DEVICE/fox_X6855.mk"

          echo "=== Required TWRP configuration ==="
          if [ ! -f vendor/twrp/config/common.mk ]; then
            echo "::error::vendor/twrp/config/common.mk is missing"
            echo "Check the synced OrangeFox source and manifest."
            exit 1
          fi

          echo "Device tree and required configuration checks passed."

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build OrangeFox vendor boot
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
          BUILD_VARIANT: ${{ inputs.BUILD_VARIANT }}
          BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
        shell: bash
        run: |
          set -eo pipefail
          cd "fox_$MANIFEST_BRANCH"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          LUNCH_COMBO="fox_X6855-ap2a-${BUILD_VARIANT}"

          echo "Lunch combo: $LUNCH_COMBO"
          echo "Build target: $BUILD_TARGET"

          lunch "$LUNCH_COMBO"

          echo "=== Selected configuration ==="
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_DEVICE=$TARGET_DEVICE"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"

          mka adbd "$BUILD_TARGET" -j"$(nproc --all)"

      - name: Verify and collect output
        if: success()
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        shell: bash
        run: |
          set -eo pipefail
          cd "fox_$MANIFEST_BRANCH"

          OUT="out/target/product/X6855"

          echo "=== Generated images ==="
          find out/target/product -type f \
            \( -name '*.img' -o -name '*.zip' \) -print

          if [ ! -f "$OUT/vendor_boot.img" ]; then
            echo "::error::vendor_boot.img was not generated."
            echo "Check the build logs and actual output location."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$OUT/vendor_boot.img" \
            "$GITHUB_WORKSPACE/release/vendor_boot.img"

          sha256sum "$GITHUB_WORKSPACE/release/vendor_boot.img"

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X6855-vendor-boot
          path: release/vendor_boot.img
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          name: OrangeFox X6855 - ${{ github.run_number }}
          tag_name: ofox-x6855-${{ github.run_id }}
          body: |
            Device: Infinix Note 50 Pro (X6855)
            Manifest branch: ${{ inputs.MANIFEST_BRANCH }}
            Device tree: ${{ inputs.DEVICE_TREE_BRANCH }}
            Target: ${{ inputs.BUILD_TARGET }}

            Verify compatibility before flashing.
          files: release/vendor_boot.img
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          
