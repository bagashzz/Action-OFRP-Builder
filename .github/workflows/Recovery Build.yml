
name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'OrangeFox sync repository'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'

      MANIFEST_BRANCH:
        description: 'OrangeFox manifest branch'
        required: true
        default: '14.1'

      DEVICE_TREE_URL:
        description: 'X6855 device tree repository'
        required: true
        default: 'https://github.com/M0z41D/Device_Tree_X6855.git'

      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        default: 'main'

      DEVICE_PATH:
        description: 'Device tree path'
        required: true
        default: 'device/infinix/X6855'

      COMMON_TREE_URL:
        description: 'Optional common tree URL'
        required: false
        default: ''

      COMMON_PATH:
        description: 'Optional common tree path'
        required: false
        default: ''

      DEVICE_NAME:
        description: 'Output device folder'
        required: true
        default: 'X6855'

      MAKEFILE_NAME:
        description: 'Lunch product name'
        required: true
        default: 'twrp_X6855'

      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'vendorbootimage'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Initialize workspace
        id: pwd
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          echo "workspace-folder=$GITHUB_WORKSPACE/workspace" >> "$GITHUB_OUTPUT"

      - name: Prepare build environment
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        shell: bash
        run: |
          set -eo pipefail

          sudo apt-get update
          sudo apt-get install -y git python3 tar aria2

          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts

          sudo bash setup/android_build_env.sh

          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Setup SSH Keys
        if: >-
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com')
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync OrangeFox sources
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        env:
          SYNC_URL: ${{ github.event.inputs.SYNC_URL }}
          MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
        shell: bash
        run: |
          set -eo pipefail

          git clone "$SYNC_URL" sync
          cd sync

          ./orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$GITHUB_WORKSPACE/workspace/fox_$MANIFEST_BRANCH"

      - name: Clone device tree
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        env:
          MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
          TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
          TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
        shell: bash
        run: |
          set -eo pipefail

          cd "fox_$MANIFEST_BRANCH"
          mkdir -p "$(dirname "$DEVICE_PATH")"

          git clone \
            --branch "$TREE_BRANCH" \
            --single-branch \
            "$TREE_URL" \
            "$DEVICE_PATH"

      - name: Clone common tree
        if: >-
          github.event.inputs.COMMON_TREE_URL != '' &&
          github.event.inputs.COMMON_PATH != ''
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        env:
          MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
          COMMON_URL: ${{ github.event.inputs.COMMON_TREE_URL }}
          COMMON_PATH: ${{ github.event.inputs.COMMON_PATH }}
          TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
        shell: bash
        run: |
          set -eo pipefail

          cd "fox_$MANIFEST_BRANCH"
          mkdir -p "$(dirname "$COMMON_PATH")"

          git clone \
            --branch "$TREE_BRANCH" \
            --single-branch \
            "$COMMON_URL" \
            "$COMMON_PATH"

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Verify device configuration
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        env:
          MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
          DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
        shell: bash
        run: |
          set -eo pipefail

          cd "fox_$MANIFEST_BRANCH"

          test -f "$DEVICE_PATH/AndroidProducts.mk" || {
            echo "::error::AndroidProducts.mk not found"
            exit 1
          }

          test -f "$DEVICE_PATH/BoardConfig.mk" || {
            echo "::error::BoardConfig.mk not found"
            exit 1
          }

          echo "Device configuration files found."

      - name: Build vendor boot image
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        env:
          MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
          MAKEFILE_NAME: ${{ github.event.inputs.MAKEFILE_NAME }}
          BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET }}
        shell: bash
        run: |
          set -eo pipefail

          cd "fox_$MANIFEST_BRANCH"

          # Do not use `set -u` here.
          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          lunch "${MAKEFILE_NAME}-eng"

          mka adbd "$BUILD_TARGET" -j"$(nproc --all)"

      - name: Verify build output
        if: success()
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        env:
          MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
          DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME }}
        shell: bash
        run: |
          set -eo pipefail

          OUT="fox_$MANIFEST_BRANCH/out/target/product/$DEVICE_NAME"

          if [ ! -d "$OUT" ]; then
            echo "::error::Output directory not found: $OUT"
            exit 1
          fi

          find "$OUT" -maxdepth 1 -type f \
            \( -name '*.img' -o -name '*.zip' \) -print

          if [ ! -f "$OUT/vendor_boot.img" ]; then
            echo "::error::vendor_boot.img not found at $OUT"
            echo "Check the actual output filename and device tree configuration."
            exit 1
          fi

      - name: Upload to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          name: X6855-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            Device: X6855
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
            Target: ${{ github.event.inputs.BUILD_TARGET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
