
name: Recovery Build - X6855 Development Tree

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: Source manifest branch
        required: true
        default: "14.1"

      DEVICE_TREE_URL:
        description: X6855 development device tree
        required: true
        default: "https://github.com/M0z41D/Device_Tree_X6855.git"

      DEVICE_TREE_BRANCH:
        description: Device tree branch
        required: true
        default: "main"

      BUILD_VARIANT:
        description: Build variant
        type: choice
        options:
          - eng
          - userdebug
        required: true
        default: eng

      BUILD_TARGET:
        description: Build target
        required: true
        default: "vendorbootimage"

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Cleanup runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Initialize workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          echo "path=$GITHUB_WORKSPACE/workspace" >> "$GITHUB_OUTPUT"

      - name: Prepare build environment
        working-directory: ${{ steps.workspace.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git python3 tar aria2 curl rsync unzip

          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh

          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Sync source
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        shell: bash
        run: |
          set -euo pipefail

          git clone https://gitlab.com/OrangeFox/sync.git sync
          cd sync

          ./orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$GITHUB_WORKSPACE/workspace/fox_$MANIFEST_BRANCH"

      - name: Clone X6855 development tree
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
          TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
          TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
        shell: bash
        run: |
          set -euo pipefail

          cd "fox_$MANIFEST_BRANCH"
          mkdir -p device/infinix

          git clone --depth=1 --single-branch \
            --branch "$TREE_BRANCH" \
            "$TREE_URL" \
            device/infinix/X6855

      - name: Verify device tree and dependencies
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        shell: bash
        run: |
          set -euo pipefail
          cd "fox_$MANIFEST_BRANCH"

          DEVICE="device/infinix/X6855"

          for file in \
            AndroidProducts.mk \
            BoardConfig.mk \
            device.mk \
            twrp_X6855.mk
          do
            if [ ! -f "$DEVICE/$file" ]; then
              echo "::error::Missing required file: $DEVICE/$file"
              exit 1
            fi
          done

          echo "=== Device tree commit ==="
          git -C "$DEVICE" log -1 --oneline

          echo "=== Product registration ==="
          cat "$DEVICE/AndroidProducts.mk"

          echo "=== TWRP product configuration ==="
          cat "$DEVICE/twrp_X6855.mk"

          if [ ! -f vendor/omni/config/common.mk ]; then
            echo "::error::vendor/omni/config/common.mk is missing."
            echo "The selected source does not provide the dependency required by twrp_X6855.mk."
            echo "Use a compatible TWRP source manifest before building."
            exit 1
          fi

      - name: Configure swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build TWRP vendor boot
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
          BUILD_VARIANT: ${{ inputs.BUILD_VARIANT }}
          BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          cd "fox_$MANIFEST_BRANCH"

          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh

          LUNCH_COMBO="twrp_X6855-$BUILD_VARIANT"

          echo "Lunch combo: $LUNCH_COMBO"
          lunch "$LUNCH_COMBO"

          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_DEVICE=$TARGET_DEVICE"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"

          mka adbd "$BUILD_TARGET" -j"$(nproc --all)"

      - name: Verify and collect image
        if: success()
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
        shell: bash
        run: |
          set -euo pipefail
          cd "fox_$MANIFEST_BRANCH"

          echo "=== Generated images ==="
          find out/target/product -type f \
            \( -name '*.img' -o -name '*.zip' \) -print

          IMAGE="$(find out/target/product \
            -type f -name vendor_boot.img -print -quit)"

          if [ -z "$IMAGE" ]; then
            echo "::error::vendor_boot.img was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$IMAGE" "$GITHUB_WORKSPACE/release/vendor_boot.img"

          sha256sum "$GITHUB_WORKSPACE/release/vendor_boot.img"

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-X6855-vendor-boot
          path: release/vendor_boot.img
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          name: TWRP X6855 - ${{ github.run_number }}
          tag_name: twrp-x6855-${{ github.run_id }}
          body: |
            Device: Infinix Note 50 Pro 4G (X6855)
            Device tree: ${{ inputs.DEVICE_TREE_URL }}
            Device tree branch: ${{ inputs.DEVICE_TREE_BRANCH }}
            Source manifest branch: ${{ inputs.MANIFEST_BRANCH }}
            Target: ${{ inputs.BUILD_TARGET }}

            Verify compatibility before flashing.
          files: release/vendor_boot.img
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
